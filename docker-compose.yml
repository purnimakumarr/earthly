# One command to run everything locally:  docker compose up --build
# Site and API: http://localhost:3000    API docs: http://localhost:3000/api/docs
services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      # development keeps the session cookie usable over plain http://localhost
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: earthly
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-not-for-production-use}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  uploads:
